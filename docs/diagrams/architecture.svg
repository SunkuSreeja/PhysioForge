  <!-- ── USER LAYER ─────────────────────────────────────────── -->
  <rect x="20" y="72" width="860" height="68" rx="12" fill="#0e2038" stroke="#1e3a5a" stroke-width="1.5"/>
  <text x="450" y="93" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600" letter-spacing="2">USER LAYER</text>
  <!-- User roles -->
