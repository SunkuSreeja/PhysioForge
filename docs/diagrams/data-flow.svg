<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4aa80"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a9eff80"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf2480"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#0a1628" rx="16"/>
  <text x="400" y="34" text-anchor="middle" fill="#00d4aa" font-size="16" font-weight="700">Analytics Data Flow</text>
  <text x="400" y="52" text-anchor="middle" fill="#4a7a8a" font-size="10">How user actions propagate to live analytics</text>

  <!-- USER ACTIONS column -->
  <text x="90" y="82" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" letter-spacing="2">USER ACTIONS</text>
  <rect x="20" y="90" width="140" height="34" rx="8" fill="#00d4aa15" stroke="#00d4aa40"/>
  <text x="90" y="112" text-anchor="middle" fill="#00d4aa" font-size="11">Exercise Completed</text>
  <rect x="20" y="134" width="140" height="34" rx="8" fill="#4a9eff15" stroke="#4a9eff40"/>
  <text x="90" y="156" text-anchor="middle" fill="#4a9eff" font-size="11">Posture Session End</text>
  <rect x="20" y="178" width="140" height="34" rx="8" fill="#fbbf2415" stroke="#fbbf2440"/>
  <text x="90" y="200" text-anchor="middle" fill="#fbbf24" font-size="11">Pain Check-in</text>
  <rect x="20" y="222" width="140" height="34" rx="8" fill="#a78bfa15" stroke="#a78bfa40"/>
  <text x="90" y="244" text-anchor="middle" fill="#a78bfa" font-size="11">Remedy Viewed</text>
  <rect x="20" y="266" width="140" height="34" rx="8" fill="#34d39915" stroke="#34d39940"/>
  <text x="90" y="288" text-anchor="middle" fill="#34d399" font-size="11">AI Chat Message</text>
  <rect x="20" y="310" width="140" height="34" rx="8" fill="#ff6b7a15" stroke="#ff6b7a40"/>
  <text x="90" y="332" text-anchor="middle" fill="#ff6b7a" font-size="11">Reminder Toggle</text>

  <!-- TRACKER FUNCTIONS column -->
  <text x="310" y="82" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" letter-spacing="2">TRACKER FUNCTIONS</text>
  <rect x="225" y="90" width="170" height="34" rx="8" fill="#0e2038" stroke="#1e3a5a"/>
  <text x="310" y="107" text-anchor="middle" fill="#94a3b8" font-size="10">trackExerciseCompleted()</text>
  <text x="310" y="120" text-anchor="middle" fill="#4a7a8a" font-size="9">→ pf_analytics_exercises</text>
  <rect x="225" y="134" width="170" height="34" rx="8" fill="#0e2038" stroke="#1e3a5a"/>
  <text x="310" y="151" text-anchor="middle" fill="#94a3b8" font-size="10">trackPostureSessionEnded()</text>
  <text x="310" y="164" text-anchor="middle" fill="#4a7a8a" font-size="9">→ pf_analytics_posture</text>
  <rect x="225" y="178" width="170" height="34" rx="8" fill="#0e2038" stroke="#1e3a5a"/>
  <text x="310" y="195" text-anchor="middle" fill="#94a3b8" font-size="10">trackRecoveryCheckIn()</text>
  <text x="310" y="208" text-anchor="middle" fill="#4a7a8a" font-size="9">→ pf_analytics_checkins</text>
  <rect x="225" y="222" width="170" height="34" rx="8" fill="#0e2038" stroke="#1e3a5a"/>
  <text x="310" y="239" text-anchor="middle" fill="#94a3b8" font-size="10">trackRemedyViewed()</text>
  <text x="310" y="252" text-anchor="middle" fill="#4a7a8a" font-size="9">→ pf_analytics_remedies</text>
  <rect x="225" y="266" width="170" height="34" rx="8" fill="#0e2038" stroke="#1e3a5a"/>
  <text x="310" y="283" text-anchor="middle" fill="#94a3b8" font-size="10">trackChatbotMessage()</text>
  <text x="310" y="296" text-anchor="middle" fill="#4a7a8a" font-size="9">→ pf_analytics_chatbot</text>
  <rect x="225" y="310" width="170" height="34" rx="8" fill="#0e2038" stroke="#1e3a5a"/>
  <text x="310" y="327" text-anchor="middle" fill="#94a3b8" font-size="10">toggleReminder()</text>
  <text x="310" y="340" text-anchor="middle" fill="#4a7a8a" font-size="9">→ pf_reminders</text>

  <!-- LOCALSTORAGE column -->
  <text x="515" y="82" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" letter-spacing="2">LOCALSTORAGE</text>
  <rect x="430" y="88" width="170" height="264" rx="10" fill="#060e1c" stroke="#1a2e46"/>
  <text x="515" y="110" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">8 Persistent Keys</text>
  <text x="515" y="132" text-anchor="middle" fill="#00d4aa" font-size="9">pf_analytics_exercises</text>
  <text x="515" y="150" text-anchor="middle" fill="#4a9eff" font-size="9">pf_analytics_posture</text>
  <text x="515" y="168" text-anchor="middle" fill="#fbbf24" font-size="9">pf_analytics_checkins</text>
  <text x="515" y="186" text-anchor="middle" fill="#a78bfa" font-size="9">pf_analytics_remedies</text>
  <text x="515" y="204" text-anchor="middle" fill="#34d399" font-size="9">pf_analytics_chatbot</text>
  <text x="515" y="222" text-anchor="middle" fill="#ff6b7a" font-size="9">pf_analytics_streaks</text>
  <text x="515" y="240" text-anchor="middle" fill="#fb923c" font-size="9">pf_analytics_badges</text>
  <text x="515" y="258" text-anchor="middle" fill="#ec4899" font-size="9">pf_analytics_activity</text>
  <text x="515" y="282" text-anchor="middle" fill="#64748b" font-size="9">pf_reminders</text>
  <line x1="450" y1="295" x2="580" y2="295" stroke="#1a2e46"/>
  <text x="515" y="312" text-anchor="middle" fill="#4a7a8a" font-size="9">bumpActivity() on every</text>
  <text x="515" y="326" text-anchor="middle" fill="#4a7a8a" font-size="9">event for heatmap</text>
  <text x="515" y="342" text-anchor="middle" fill="#4a7a8a" font-size="9">updateStreak() on active</text>

  <!-- ANALYTICS OUTPUT -->
  <text x="700" y="82" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" letter-spacing="2">COMPUTED OUTPUT</text>
  <rect x="630" y="90" width="148" height="262" rx="10" fill="#060e1c" stroke="#1a2e46"/>
  <text x="704" y="114" text-anchor="middle" fill="#00d4aa" font-size="10" font-weight="600">getAllStats()</text>
  <line x1="640" y1="122" x2="768" y2="122" stroke="#1a2e46"/>
  <text x="704" y="142" text-anchor="middle" fill="#4a9eff" font-size="9">Exercise completion %</text>
  <text x="704" y="158" text-anchor="middle" fill="#4a9eff" font-size="9">Week/month delta</text>
  <text x="704" y="178" text-anchor="middle" fill="#a78bfa" font-size="9">Posture avg/peak</text>
  <text x="704" y="194" text-anchor="middle" fill="#a78bfa" font-size="9">Score trend slope</text>
  <text x="704" y="214" text-anchor="middle" fill="#fbbf24" font-size="9">Pain improvement %</text>
  <text x="704" y="230" text-anchor="middle" fill="#fbbf24" font-size="9">7-day trend</text>
  <text x="704" y="250" text-anchor="middle" fill="#00d4aa" font-size="9">Consistency grade</text>
  <text x="704" y="266" text-anchor="middle" fill="#00d4aa" font-size="9">A/B/C/D/F score</text>
  <text x="704" y="286" text-anchor="middle" fill="#34d399" font-size="9">Streak current/best</text>
  <text x="704" y="302" text-anchor="middle" fill="#34d399" font-size="9">Total active days</text>
  <text x="704" y="322" text-anchor="middle" fill="#ff6b7a" font-size="9">Badges earned</text>
  <text x="704" y="338" text-anchor="middle" fill="#ff6b7a" font-size="9">Remedy frequency</text>

  <!-- Bottom label -->
  <rect x="20" y="380" width="760" height="80" rx="12" fill="#0c1a2e" stroke="#1a3050"/>
  <text x="400" y="402" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" letter-spacing="2">CONTEXT → COMPONENTS</text>
  <text x="400" y="422" text-anchor="middle" fill="#94a3b8" font-size="11">AnalyticsContext refreshStats() → re-renders Analytics page (7 tabs) · Dashboard rings · Streak badge</text>
  <text x="400" y="442" text-anchor="middle" fill="#94a3b8" font-size="11">ReminderContext → RemindersPage · ReminderWidget · DashboardLayout</text>
  <text x="400" y="459" text-anchor="middle" fill="#4a7a8a" font-size="10">All updates are synchronous localStorage reads/writes — no network required · works offline</text>

  <!-- Connecting arrows (action → tracker) -->
  <line x1="160" y1="107" x2="225" y2="107" stroke="#00d4aa60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="151" x2="225" y2="151" stroke="#4a9eff60" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="160" y1="195" x2="225" y2="195" stroke="#fbbf2460" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="160" y1="239" x2="225" y2="239" stroke="#a78bfa60" stroke-width="1.5"/>
  <line x1="160" y1="283" x2="225" y2="283" stroke="#34d39960" stroke-width="1.5"/>
  <line x1="160" y1="327" x2="225" y2="327" stroke="#ff6b7a60" stroke-width="1.5"/>

  <!-- Tracker → localStorage -->
  <line x1="395" y1="200" x2="430" y2="200" stroke="#ffffff30" stroke-width="1.5"/>

  <!-- localStorage → output -->
  <line x1="600" y1="200" x2="630" y2="200" stroke="#ffffff30" stroke-width="1.5"/>
</svg>
